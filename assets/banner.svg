<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Atharva Funde — AI, Full-Stack &amp; Blockchain Engineer</title>
<desc>Animated hero banner: typed role cycler and a connected network graphic linking AI, Full-Stack and Blockchain.</desc>
<defs>
  <clipPath id="roundedCard">
    <rect width="1200" height="330" rx="20"/>
  </clipPath>

  <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#05070D"/>
    <stop offset="55%" stop-color="#0B0F1E"/>
    <stop offset="100%" stop-color="#090C16"/>
  </linearGradient>

  <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#818CF8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#818CF8"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>

  <filter id="blurXL" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="46"/>
  </filter>
  <filter id="blurMD" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#7C8AA5"/>
  </pattern>

  <clipPath id="clipPhrase1">
    <rect x="112" y="204" width="0" height="36">
      <animate attributeName="width" attributeType="XML" calcMode="linear"
        values="0;190;190;0;0" keyTimes="0;0.0556;0.2667;0.3333;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="clipPhrase2">
    <rect x="112" y="204" width="0" height="36">
      <animate attributeName="width" attributeType="XML" calcMode="linear"
        values="0;0;350;350;0;0" keyTimes="0;0.3333;0.3889;0.6;0.6667;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="clipPhrase3">
    <rect x="112" y="204" width="0" height="36">
      <animate attributeName="width" attributeType="XML" calcMode="linear"
        values="0;0;350;350;0" keyTimes="0;0.6667;0.7222;0.9333;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

<g clip-path="url(#roundedCard)">
  <rect width="1200" height="330" fill="url(#bgGrad)"/>
  <rect width="1200" height="330" fill="url(#dotGrid)" opacity="0.05"/>

  <!-- ambient glow -->
  <g filter="url(#blurXL)">
    <circle cx="140" cy="270" r="130" fill="url(#glowIndigo)">
      <animateTransform attributeName="transform" type="translate" values="0,0;18,-12;0,0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="90" r="90" fill="url(#glowCyan)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="985" cy="170" r="210" fill="url(#glowBlue)" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-14,10;0,0" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outline -->
  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="19.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- left: identity block -->
  <text x="80" y="98" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1" fill="#64748B">$ whoami</text>
  <rect x="160" y="85" width="9" height="16" fill="#22D3EE">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <text x="78" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="#F8FAFC">Atharva Funde</text>
  <rect x="81" y="184" width="150" height="4" rx="2" fill="url(#underlineGrad)"/>

  <!-- animated role cycler -->
  <text x="80" y="228" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="600" fill="#475569">&gt;</text>
  <g clip-path="url(#clipPhrase1)">
    <text x="112" y="228" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="600" fill="#22D3EE">AI Engineer</text>
  </g>
  <g clip-path="url(#clipPhrase2)">
    <text x="112" y="228" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="600" fill="#38BDF8">Full-Stack Engineer</text>
  </g>
  <g clip-path="url(#clipPhrase3)">
    <text x="112" y="228" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="600" fill="#818CF8">Blockchain Engineer</text>
  </g>

  <text x="80" y="266" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A3B8">Building AI Agents &#183; Smart Contracts &#183; Full-Stack Apps</text>
  <text x="80" y="292" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#475569">Pune, India</text>

  <!-- right: connected network (AI / Full-Stack / Blockchain) -->
  <g stroke="#475569" stroke-opacity="0.4" stroke-width="1.2">
    <line x1="830" y1="112" x2="782" y2="152"/>
    <line x1="830" y1="112" x2="802" y2="82"/>
    <line x1="830" y1="112" x2="872" y2="62"/>
    <line x1="962" y1="232" x2="902" y2="270"/>
    <line x1="962" y1="232" x2="1002" y2="290"/>
    <line x1="962" y1="232" x2="1030" y2="202"/>
    <line x1="1092" y1="122" x2="1052" y2="62"/>
    <line x1="1092" y1="122" x2="1132" y2="170"/>
    <line x1="1092" y1="122" x2="1150" y2="92"/>
  </g>
  <g stroke-opacity="0.45" stroke-width="1.4">
    <line x1="830" y1="112" x2="962" y2="232" stroke="#22D3EE"/>
    <line x1="962" y1="232" x2="1092" y2="122" stroke="#38BDF8"/>
    <line x1="1092" y1="122" x2="830" y2="112" stroke="#818CF8"/>
  </g>

  <g>
    <circle cx="782" cy="152" r="3" fill="#64748B"/>
    <circle cx="802" cy="82" r="3" fill="#64748B"/>
    <circle cx="872" cy="62" r="3" fill="#64748B"/>
    <circle cx="902" cy="270" r="3" fill="#64748B"/>
    <circle cx="1002" cy="290" r="3" fill="#64748B"/>
    <circle cx="1030" cy="202" r="3" fill="#64748B"/>
    <circle cx="1052" cy="62" r="3" fill="#64748B"/>
    <circle cx="1132" cy="170" r="3" fill="#64748B"/>
    <circle cx="1150" cy="92" r="3" fill="#64748B"/>
  </g>

  <!-- hub halos -->
  <g filter="url(#blurMD)">
    <circle cx="830" cy="112" r="22" fill="#22D3EE" opacity="0.35">
      <animate attributeName="opacity" values="0.22;0.45;0.22" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="962" cy="232" r="22" fill="#38BDF8" opacity="0.35">
      <animate attributeName="opacity" values="0.22;0.45;0.22" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1092" cy="122" r="22" fill="#818CF8" opacity="0.35">
      <animate attributeName="opacity" values="0.22;0.45;0.22" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- hub nodes -->
  <circle cx="830" cy="112" r="7" fill="#22D3EE">
    <animate attributeName="r" values="6.5;8.5;6.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="962" cy="232" r="7" fill="#38BDF8">
    <animate attributeName="r" values="6.5;8.5;6.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1092" cy="122" r="7" fill="#818CF8">
    <animate attributeName="r" values="6.5;8.5;6.5" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- data packets traveling between hubs -->
  <circle r="3" fill="#E0F2FE">
    <animateMotion dur="4s" repeatCount="indefinite" path="M830,112 L962,232 L830,112"/>
  </circle>
  <circle r="3" fill="#E0E7FF">
    <animateMotion dur="5s" repeatCount="indefinite" path="M962,232 L1092,122 L962,232"/>
  </circle>

  <!-- hub labels -->
  <text x="830" y="145" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#7DD3FC" opacity="0.85">AI</text>
  <text x="962" y="262" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#7DD3FC" opacity="0.85">Full-Stack</text>
  <text x="1092" y="102" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#A5B4FC" opacity="0.85">Blockchain</text>
</g>
</svg>
